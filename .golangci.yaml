version: "2"
linters:
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - containedctx
    - contextcheck
    - copyloopvar
    - decorder
    - dupword
    - durationcheck
    - errname
    - errorlint
    - gochecknoglobals
    - goconst
    - gocritic
    - gocyclo
    - godot
    - gosec
    - intrange
    - makezero
    - misspell
    - nestif
    - nilerr
    - nilnil
    - noctx
    - prealloc
    - predeclared
    - staticcheck
    - unparam
    - whitespace
    - wrapcheck
  settings:
    gocyclo:
      min-complexity: 15
    wrapcheck:
      ignore-sig-regexps:
        - func \(github\.com/labstack/echo/..\.Context\)\.*
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # Test fixtures repeat literal values on purpose.
      - path: _test\.go
        linters:
          - goconst
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
